<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Women Shopping</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f8f8f8;
    }

    header {
      background: #ff4d6d;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
    }

    .cart {
      position: absolute;
      right: 20px;
      top: 15px;
      font-size: 18px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      width: 220px;
      margin: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      padding: 15px;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 220px;
      border-radius: 10px;
      object-fit: cover;
    }

    .price {
      color: green;
      font-weight: bold;
      margin: 10px 0;
    }

    button {
      background: #ff4d6d;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #e60039;
    }

    .total {
      text-align: center;
      font-size: 20px;
      margin: 20px;
    }
  </style>
</head>
<body>

<header>
  Women Shopping 🛍️
  <div class="cart">Cart: <span id="cartCount">0</span></div>
</header>

<div class="container" id="productList"></div>

<div class="total">
  Total: ₹ <span id="totalPrice">0</span>
</div>

<script>
  const products = [
    { id: 1, name: "Floral Dress", price: 799, img: "https://via.placeholder.com/200" },
    { id: 2, name: "Handbag", price: 1199, img: "https://via.placeholder.com/200" },
    { id: 3, name: "Heels", price: 999, img: "https://via.placeholder.com/200" },
    { id: 4, name: "Kurti", price: 599, img: "https://via.placeholder.com/200" },
    { id: 5, name: "Sunglasses", price: 399, img: "https://via.placeholder.com/200" },
    { id: 6, name: "Watch", price: 1499, img: "https://via.placeholder.com/200" }
  ];

  let cartCount = 0;
  let totalPrice = 0;

  const productList = document.getElementById("productList");

  products.forEach(product => {
    const div = document.createElement("div");
    div.classList.add("card");

    div.innerHTML = `
      <img src="${product.img}" alt="${product.name}">
      <h3>${product.name}</h3>
      <p class="price">₹ ${product.price}</p>
      <button onclick="addToCart(${product.price})">Add to Cart</button>
    `;

    productList.appendChild(div);
  });

  function addToCart(price) {
    cartCount++;
    totalPrice += price;

    document.getElementById("cartCount").innerText = cartCount;
    document.getElementById("totalPrice").innerText = totalPrice;
  }
</script>

</body>
</html>
